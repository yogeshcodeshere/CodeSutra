services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: namaste
      POSTGRES_PASSWORD: namaste
      POSTGRES_DB: namaste_icd11
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U namaste -d namaste_icd11"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://namaste:namaste@postgres:5432/namaste_icd11?schema=public
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npx prisma db push && npm run seed:demo && npm run dev"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:3000
    ports:
      - "3001:3001"
    command: npm run dev

volumes:
  postgres_data:
